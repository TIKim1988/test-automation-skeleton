# lomastore.com 장바구니 화면 요소 매핑
# 2026-07-10 실제 화면 확인 (비로그인 게스트 장바구니로 접근 가능함을 확인).
# 2026-07-11 수정: empty_cart_message role:generic → text 셀렉터로 변경

pages:
  cart_page: /cart

elements:
  remove_item_x_button:
    role: button
    name: 상품 제거
  delete_item_button:
    role: button
    name: 항목 삭제
  quantity_decrease_button:
    role: button
    name: 수량 감소
  quantity_increase_button:
    role: button
    name: 수량 증가
  clear_cart_button:
    role: button
    name: 장바구니 비우기
  clear_cart_confirm_button:
    role: button
    name: 비우기
  clear_cart_cancel_button:
    role: button
    name: 취소
  remove_item_confirm_button:
    role: button
    name: 빼기
  # 실제 접근성 이름은 "N개 상품 주문하기" (N은 담긴 수량에 따라 동적) - 자동화 쪽에서 부분/정규식 일치 필요
  order_button:
    role: button
    name: 상품 주문하기
  wishlist_button:
    role: button
    name: 찜하기
  empty_cart_shopping_link:
    role: link
    name: 쇼핑하기
  empty_cart_home_link:
    role: link
    name: 홈으로
  # role:generic 은 getByRole()에서 지원하지 않아 text 셀렉터로 대체
  empty_cart_message:
    text: 장바구니가 비어 있습니다.
