pages:
  cart_page: /cart
elements:
  remove_item_x_button:
    role: button
    name: 상품 제거
  delete_item_button:
    role: button
    name: 항목 삭제
  clear_cart_button:
    role: button
    name: 장바구니 비우기
  clear_cart_confirm_button:
    role: button
    name: 비우기
    exact: true
  clear_cart_cancel_button:
    role: button
    name: 취소
  remove_item_confirm_button:
    role: button
    name: 빼기
  order_button:
    role: button
    nameRegex: 상품 주문하기$
  empty_cart_shopping_link:
    role: link
    name: 쇼핑하기
    scope: main_scope
  empty_cart_home_link:
    role: link
    name: 홈으로
    scope: main_scope
  empty_cart_message:
    text: 장바구니가 비어 있습니다.
    exact: false
    scope: main_scope
  cart_item:
    css: div:has(> button[aria-label="상품 제거"])
    scope: main_scope
  cart_quantity_increase_button:
    role: button
    name: 수량 증가
    scope: cart_item
    exact: true
  cart_quantity_decrease_button:
    role: button
    name: 수량 감소
    scope: cart_item
    exact: true
