# lomastore.com 홈 화면 요소 매핑
# 2026-07-10 실제 화면 확인 후 작성 (Claude in Chrome)
# 2026-07-11 배너·인기상품·풋터 셀렉터 추가
# 2026-07-11 nav_store: substring 오매칭 수정 (header a[href] CSS 셀렉터로 변경)
# 2026-07-11 terms_page_heading, order_tracking_page_heading 추가

pages:
  home_page: /

elements:
  nav_store:
    css: "header a[href='/store']"
  nav_curation:
    role: link
    name: 큐레이션
  nav_event:
    role: link
    name: 이벤트
  nav_blog:
    role: link
    name: 블로그
  header_login_link:
    role: link
    name: 로그인
  header_cart_link:
    role: link
    name: 장바구니
  header_search_button:
    role: button
    name: 검색
  popular_tab_condom_gel:
    role: tab
    name: "콘돔·젤"
  popular_tab_healthcare:
    role: tab
    name: 헬스케어
  popular_tab_home_party:
    role: tab
    name: 홈파티
  popular_tab_style:
    role: tab
    name: 스타일
  popular_tab_pleasure_toy:
    role: tab
    name: 플레저 토이

  # ── 배너 ──────────────────────────────────────────────────────────────
  # .home-banner-pagination 은 메인 히어로 배너에만 붙는 고유 클래스
  home_banner_pagination:
    css: .home-banner-pagination
  # 현재 활성 슬라이드 링크를 가리킴 (배너 제일 위 section.max-w-7xl 내부)
  home_banner_active_slide_link:
    css: "section.max-w-7xl .swiper-slide-active a"

  # ── 인기상품 ──────────────────────────────────────────────────────────
  # tablist 내 section(= 인기상품 섹션)의 첫 번째 슬라이드 활성 카드
  popular_product_card:
    css: "section:has([role='tablist']) .swiper-slide-active a[href*='/product/']"

  # ── 풋터 ──────────────────────────────────────────────────────────────
  footer_terms_link:
    role: link
    name: 이용약관
  footer_privacy_link:
    role: link
    name: 개인정보처리방침
  footer_order_tracking_link:
    role: link
    name: 비회원 주문조회
  footer_cs_faq_link:
    role: link
    name: 자주 찾는 질문

  # ── 이동 후 대상 페이지 헤딩 ────────────────────────────────────────
  # 이용약관 페이지 (/legal/terms-of-use) 의 메인 제목
  terms_page_heading:
    role: heading
    name: 로마스토어 이용약관
  # 비회원 주문조회 페이지 (/information/order-tracking) 의 메인 제목
  order_tracking_page_heading:
    role: heading
    name: 비회원 주문조회
