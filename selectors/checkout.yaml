pages:
  checkout_page: /checkout
elements:
  orderer_name_input:
    css: '#billing_first_name'
    scope: main_scope
  orderer_phone_input:
    css: '#billing_phone'
    scope: main_scope
  orderer_email_input:
    css: '#billing_email'
    scope: main_scope
  receiver_name_input:
    css: '#shipping_first_name'
    scope: main_scope
  receiver_phone_input:
    css: '#shipping_phone'
    scope: main_scope
  receiver_zipcode_input:
    css: '#shipping_postcode'
    scope: main_scope
  address_search_button:
    role: button
    name: 주소찾기
    exact: true
    scope: main_scope
  payment_method_card_radio:
    role: radio
    name: 신용카드
    exact: true
    scope: main_scope
  payment_method_transfer_radio:
    role: radio
    name: 퀵계좌이체
    exact: true
    scope: main_scope
  payment_method_bacs_radio:
    role: radio
    name: 무통장입금
    exact: true
    scope: main_scope
  terms_of_service_button:
    role: button
    name: 이용약관
  privacy_policy_button:
    role: button
    name: 개인정보처리방침
  final_pay_button:
    role: button
    name: 결제하기

  payment_method_transfer_label:
    text: 퀵계좌이체
    exact: true
    scope: main_scope
  payment_method_card_label:
    text: 신용카드
    exact: true
    scope: main_scope
  payment_method_bacs_label:
    text: 무통장입금
    exact: true
    scope: main_scope
