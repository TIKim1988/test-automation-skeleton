name: Scheduled Playwright Tests

on:
  push:
    branches: [main, codex/automation-operability]
  schedule:
    # 매일 한국 시간 09:00 (UTC 00:00)에 핵심 smoke 테스트만 실행합니다.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: '실행할 테스트 범위'
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - regression
          - all

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate spreadsheet source and generated YAML
        run: npm run check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Select test suite
        run: |
          suite="${{ github.event_name != 'workflow_dispatch' && 'smoke' || inputs.suite }}"
          if [ "$suite" = "all" ]; then
            echo "TEST_TAGS=" >> "$GITHUB_ENV"
          else
            echo "TEST_TAGS=$suite" >> "$GITHUB_ENV"
          fi
          echo "Running suite: $suite"

      - name: Run Playwright tests
        id: tests
        run: npx playwright test
        continue-on-error: true

      - name: Summarize results
        id: summary
        if: always()
        run: npm run report:summary
        continue-on-error: true

      - name: Zip HTML report
        if: always()
        run: zip -r playwright-report.zip playwright-report

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Email report
        if: always() && github.event_name != 'push'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Playwright Automation <${{ secrets.GMAIL_USERNAME }}>
          to: k39008116@gmail.com
          subject: "${{ steps.summary.outputs.icon }} lomastore 자동화 결과 - 통과 ${{ steps.summary.outputs.passed }} / 실패 ${{ steps.summary.outputs.failed }} / 재시도 통과 ${{ steps.summary.outputs.flaky }} / 스킵 ${{ steps.summary.outputs.skipped }} / 실행 오류 ${{ steps.summary.outputs.errors }}"
          html_body: |
            <p>실행 결과는 첨부된 <code>playwright-report.zip</code>의 <code>index.html</code>에서 확인하세요.</p>
            <p>통과: ${{ steps.summary.outputs.passed }} / 실패: ${{ steps.summary.outputs.failed }} / 재시도 통과: ${{ steps.summary.outputs.flaky }} / 스킵: ${{ steps.summary.outputs.skipped }} / 실행 오류: ${{ steps.summary.outputs.errors }}</p>
            <p>실패 목록과 오류 첫 줄은 <code>email-summary.html</code> 첨부파일에서 확인하세요.</p>
          attachments: playwright-report.zip,test-results/email-summary.html

      - name: Fail job if tests or result processing failed
        if: always() && (steps.tests.outcome != 'success' || steps.summary.outcome != 'success' || steps.summary.outputs.ok != 'true')
        run: exit 1
