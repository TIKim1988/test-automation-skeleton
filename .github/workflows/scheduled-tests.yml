name: Scheduled Playwright Tests

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: tests
        run: npx playwright test
        continue-on-error: true
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Summarize results
        id: summary
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('test-results/results.json', 'utf8'));
          const s = r.stats;
          const failed = s.unexpected + s.flaky;
          const lines = [
            'passed=' + s.expected,
            'failed=' + failed,
            'skipped=' + s.skipped,
            'icon=' + (failed > 0 ? '❌' : '✅'),
          ];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, lines.join('\n') + '\n');
          "

      - name: Sync failure issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node automation/ci/sync-failure-issues.js

      - name: Delete previous report artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api repos/${{ github.repository }}/actions/artifacts --paginate -q '.artifacts[] | select(.name=="playwright-report") | .id')
          for id in $ids; do
            echo "Deleting old artifact $id"
            gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id || true
          done

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 1

      - name: Email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: k39008116@gmail.com
          password: ${{ secrets.GMAIL_SECRET_KEY }}
          from: Playwright Automation <k39008116@gmail.com>
          to: k39008116@gmail.com
          subject: "${{ steps.summary.outputs.icon }} lomastore 자동화 결과 - 통과 ${{ steps.summary.outputs.passed }} / 실패 ${{ steps.summary.outputs.failed }} / 스킵 ${{ steps.summary.outputs.skipped }}"
          html_body: |
            <p>lomastore.com 자동화 테스트 결과입니다.</p>
            <ul>
              <li>통과: ${{ steps.summary.outputs.passed }}</li>
              <li>실패: ${{ steps.summary.outputs.failed }}</li>
              <li>스킵: ${{ steps.summary.outputs.skipped }}</li>
            </ul>
            <p>실행 로그: <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</a></p>
            <p>상세 HTML 리포트는 위 링크의 Artifacts에서 내려받아 확인해주세요 (용량이 커서 메일 첨부는 생략합니다).</p>

      - name: Fail job if tests failed
        if: steps.summary.outputs.failed != '0'
        run: exit 1
