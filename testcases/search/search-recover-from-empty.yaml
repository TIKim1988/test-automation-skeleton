id: SEARCH-004
title: 검색 결과 없음 상태에서 정상 검색어로 바꾸면 상품 목록이 복구된다
tags:
  - regression
  - search
priority: P2
status: active
enabled: true
precondition: 새 브라우저 컨텍스트의 비회원 세션; 결과 없는 검색어와 대표 상품 검색어 유효
last_verified: "2026-10-07"
steps:
  - action: navigate
    target: home_page
  - action: custom
    value: ${search.keyword_no_match}
    name: search_for
  - action: custom
    name: assert_empty_search
  - action: custom
    value: ${search.keyword_with_results}
    name: search_for
  - action: custom
    name: assert_search_results
