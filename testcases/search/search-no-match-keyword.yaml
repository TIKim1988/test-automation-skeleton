# 참고: 무의미한 문자열로 검색해도 실제로는 결과가 0건이 아니라 관련 없어 보이는 상품이 1건 노출되는 것을
# 실제 화면에서 확인했다 (검색 연관도 로직 확인 필요 가능성). 이 테스트케이스는 "화면이 깨지지 않고
# 정상적으로 검색 결과 화면을 보여준다"까지만 검증한다. 0건/빈 결과 UI 자체는 별도 확인이 더 필요하다.
id: SEARCH-003
title: 결과가 거의 없을 법한 키워드로 검색해도 검색 결과 화면이 정상적으로 노출된다
tags: [regression, search]
last_verified: "2026-07-10"
steps:
  - action: navigate
    target: home_page
  - action: click
    target: header_search_button
  - action: fill
    target: search_input
    value: "${search.keyword_no_match}"
  - action: click
    target: search_submit_button
  - action: assert_visible
    target: search_page_heading
