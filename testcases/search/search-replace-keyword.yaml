id: SEARCH-005
title: 검색어를 바꾸면 URL과 결과 목록이 새 검색어에 맞게 갱신된다
tags:
  - regression
  - search
priority: P2
status: active
enabled: true
precondition: 새 브라우저 컨텍스트의 비회원 세션; 네이키드 휘그 검색 결과가 대표 상품 1개
last_verified: "2026-10-07"
steps:
  - action: navigate
    target: home_page
  - action: custom
    value: ${search.keyword_with_results}
    name: search_for
  - action: custom
    name: assert_search_results
  - action: custom
    value: ${search.keyword_single_result}
    name: search_for
  - action: custom
    value: ${search.keyword_single_result}
    name: assert_search_results
    params:
      count: 1
