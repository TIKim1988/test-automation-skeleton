id: LOGIN-002
title: 잘못된 비밀번호로는 로그인에 실패한다
tags: [regression, login]
last_verified: "2026-07-10"
steps:
  - action: navigate
    target: login_page
  - action: fill
    target: email_input
    value: "${user.email}"
  - action: fill
    target: password_input
    value: "wrong-password"
  - action: click
    target: login_button
  - action: assert_hidden
    target: dashboard_header
