# 테스트케이스 관리 프로젝트가 소유/유지보수하는 파일.
# 사람이 읽는 시나리오이자, 자동화 프로젝트가 그대로 실행하는 실행 스펙이기도 합니다.

id: LOGIN-001
title: 정상적인 이메일/비밀번호로 로그인에 성공한다
tags: [smoke, login]
last_verified: "2026-07-10"
steps:
  - action: navigate
    target: login_page
  - action: fill
    target: email_input
    value: "${user.email}"
  - action: fill
    target: password_input
    value: "${user.password}"
  - action: click
    target: login_button
  - action: assert_visible
    target: dashboard_header
