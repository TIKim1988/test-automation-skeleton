id: CHECKOUT-002
title: 주문자와 수령자에 서로 다른 값을 입력하면 각각 유지된다
tags:
  - regression
  - checkout
priority: P2
status: active
enabled: true
precondition: 새 브라우저 컨텍스트의 비로그인 세션; 대표 상품 재고 있음; 테스트가 상품 1개를 독립적으로 담고 완료 확인
last_verified: "2026-09-08"
steps:
  - action: custom
    name: prepare_cart
  - action: click
    target: order_button
  - action: custom
    name: assert_checkout
  - action: fill
    target: orderer_name_input
    value: ${checkout.guest_orderer.name}
  - action: fill
    target: orderer_phone_input
    value: ${checkout.guest_orderer.phone}
  - action: fill
    target: orderer_email_input
    value: ${checkout.guest_orderer.email}
  - action: fill
    target: receiver_name_input
    value: ${checkout.guest_receiver.name}
  - action: fill
    target: receiver_phone_input
    value: ${checkout.guest_receiver.phone}
  - action: assert_visible
    target: address_search_button
  - action: assert_value
    target: orderer_name_input
    value: ${checkout.guest_orderer.name}
  - action: assert_value
    target: orderer_phone_input
    value: ${checkout.guest_orderer.phone}
  - action: assert_value
    target: orderer_email_input
    value: ${checkout.guest_orderer.email}
  - action: assert_value
    target: receiver_name_input
    value: ${checkout.guest_receiver.name}
  - action: assert_value
    target: receiver_phone_input
    value: ${checkout.guest_receiver.phone}
