id: CHECKOUT-005
title: 주문서 작성 후 최종 결제 버튼이 노출된다 (실제 결제는 수행하지 않음)
tags:
  - smoke
  - checkout
priority: P1
status: active
enabled: true
last_verified: "2026-07-10"
steps:
  - action: navigate
    target: product_guest_accessible_page
  - action: click
    target: add_to_cart_button
  - action: navigate
    target: cart_page
  - action: click
    target: order_button
  - action: fill
    target: orderer_name_input
    value: ${checkout.guest_orderer.name}
  - action: fill
    target: orderer_phone_input
    value: ${checkout.guest_orderer.phone}
  - action: fill
    target: orderer_email_input
    value: ${checkout.guest_orderer.email}
  - action: assert_visible
    target: final_pay_button
