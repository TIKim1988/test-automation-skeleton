id: CHECKOUT-005
title: 주문서 작성 후 최종 결제 버튼이 노출된다 (실제 결제는 수행하지 않음)
tags:
  - smoke
  - checkout
priority: P1
status: active
enabled: true
precondition: 새 브라우저 컨텍스트의 비로그인 세션; 대표 상품 재고 있음; 테스트가 상품 1개를 독립적으로 담고 완료 확인
last_verified: "2026-09-21"
steps:
  - action: custom
    name: prepare_cart
  - action: click
    target: order_button
  - action: custom
    name: assert_checkout
  - action: fill
    target: orderer_name_input
    value: ${checkout.guest_orderer.name}
  - action: fill
    target: orderer_phone_input
    value: ${checkout.guest_orderer.phone}
  - action: fill
    target: orderer_email_input
    value: ${checkout.guest_orderer.email}
  - action: assert_visible
    target: final_pay_button
